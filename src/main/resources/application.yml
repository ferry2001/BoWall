server:
  port: 8080
spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    #应用的名称，可选
    name: bowall
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 通过环境变量提供连接信息，避免把密码提交到仓库。
    url: ${BOWALL_DB_URL:jdbc:mysql://127.0.0.1:3306/bowall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BOWALL_DB_USERNAME:root}
    password: ${BOWALL_DB_PASSWORD:}
  main:
    allow-bean-definition-overriding: true

  mybatis-plus:
    configuration:
      #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: ASSIGN_ID
    main:
      allow-bean-definition-overriding: true
  redis:
    host: ${BOWALL_REDIS_HOST:127.0.0.1}
    port: ${BOWALL_REDIS_PORT:6379}
    password: ${BOWALL_REDIS_PASSWORD:}
    database: ${BOWALL_REDIS_DATABASE:0}
  cache:
    redis:
      time-to-live: 1800000 #设置缓存数据的过期时间
mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
#    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
