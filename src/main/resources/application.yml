server:
  port: 8080
spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    #应用的名称，可选
    name: bowall
  servlet:
    multipart:
      # 图片动态最多支持 9 张；放宽默认的 1MB / 10MB 限制。
      max-file-size: 20MB
      max-request-size: 100MB
  sql:
    init:
      # schema.sql 中的 DDL 均为幂等操作；启动时确保回复评论所需列已经存在。
      mode: always
      schema-locations: classpath:db/schema.sql
      # 旧版 MySQL 不支持 IF NOT EXISTS；重复执行的“已存在”DDL 错误可安全忽略。
      continue-on-error: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 通过环境变量提供连接信息，避免把密码提交到仓库。
    url: ${BOWALL_DB_URL:jdbc:mysql://127.0.0.1:3306/bowall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BOWALL_DB_USERNAME:root}
    password: ${BOWALL_DB_PASSWORD:}
  main:
    allow-bean-definition-overriding: true

  mybatis-plus:
    configuration:
      #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: ASSIGN_ID
    main:
      allow-bean-definition-overriding: true
  redis:
    host: ${BOWALL_REDIS_HOST:127.0.0.1}
    port: ${BOWALL_REDIS_PORT:6379}
    password: ${BOWALL_REDIS_PASSWORD:}
    database: ${BOWALL_REDIS_DATABASE:0}
  cache:
    redis:
      time-to-live: 1800000 #设置缓存数据的过期时间
app:
  jwt:
    # 生产环境必须通过 BOWALL_JWT_SECRET 配置一个随机的高强度密钥。
    secret: ${BOWALL_JWT_SECRET:bowall-local-development-secret-change-before-production}
    expires-hours: ${BOWALL_JWT_EXPIRES_HOURS:72}
  recommendation:
    # mode 可设为 quality（规则评分）或 time（纯时间倒序，快速回退）。
    default-mode: quality
    smoothing-views: 12
    freshness-half-life-hours: 36
    exploration-weight: 0.05
    weights:
      dwell-quality: 0.21
      effective-read: 0.14
      like-rate: 0.10
      comment-rate: 0.08
      low-skip-rate: 0.08
      freshness: 0.11
      author-affinity: 0.05
      author-audience: 0.05
      global-heat: 0.07
      traffic-pool: 0.11
mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
#    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
